name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,api]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest
        run: pytest --cov=campaign_forge --cov-report=term-missing --cov-fail-under=90

      - name: Evaluation (offline smoke)
        run: python evals/run_eval.py --offline --min-pass-rate 1.0

      - name: Evaluation (offline, full-campaign workflow)
        run: python evals/run_eval.py --offline --workflow full-campaign --min-pass-rate 1.0

      - name: Evaluation Lab (offline benchmarks against their baselines)
        run: |
          B=src/campaign_forge/evaluation/baselines
          campaign-forge bench full-campaign --offline --baseline $B/full-campaign.corpus.json
          campaign-forge bench full-campaign --offline --dataset injection --baseline $B/full-campaign.injection.json
          campaign-forge bench seo-content-pack --offline --baseline $B/seo-content-pack.corpus.json

  docker:
    name: Docker image (API health and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t campaign-forge-api:ci .

      - name: Run the container (simulated provider)
        run: >
          docker run -d --name forge -p 8000:8000
          -e CF_API_KEYS=ci-key-0123456789 -e CF_PROVIDER=fake
          campaign-forge-api:ci

      - name: Smoke-test the API in the container
        run: python scripts/api_smoke.py http://127.0.0.1:8000 ci-key-0123456789

      - name: Docker reports the container healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' forge)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Container logs
        if: always()
        run: docker logs forge
