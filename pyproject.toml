[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-forge"
dynamic = ["version"]
description = "A production-grade multi-agent workflow that turns a product brief into a complete marketing campaign."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Syed Waleed Ahmed" }]
keywords = [
    "ai",
    "agents",
    "multi-agent",
    "llm",
    "marketing",
    "workflow-automation",
    "groq",
    "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "openai>=1.30,<3",  # 3.x swapped httpx for httpx2; migrate deliberately (ADR-021)
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "rich>=13.7",
    "httpx>=0.27",  # research tools (also used by openai 2.x)
    "markdown-it-py>=3.0",  # HTML export with raw HTML disabled (already required by rich)
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40,<2",  # the Streamlit app in app/ (Session 6)
]
api = [
    "fastapi>=0.115,<1",  # the HTTP API in campaign_forge.api (Session 7)
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.20",  # pinned: matches .pre-commit-config.yaml; CI must check what was checked locally
    "mypy==2.1.0",  # pinned for reproducible strict type-checking
]

[project.urls]
Homepage = "https://github.com/syed-waleed-ahmed/Multi-Agent-Workflow"
Repository = "https://github.com/syed-waleed-ahmed/Multi-Agent-Workflow"
Issues = "https://github.com/syed-waleed-ahmed/Multi-Agent-Workflow/issues"

[project.scripts]
campaign-forge = "campaign_forge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "campaign_forge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campaign_forge = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["campaign_forge"]

[tool.mypy]
python_version = "3.10"
packages = ["campaign_forge"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# Streamlit's annotations import numpy, pandas and pyarrow. New numpy stubs use the
# Python 3.12 `type` statement, which mypy rejects when checking for 3.10, so these
# third-party trees are not followed (they type as Any). Nothing here imports them.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*", "pyarrow", "pyarrow.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    # Starlette 1.x's TestClient prefers httpx2 but still works with httpx (the openai 2.x
    # SDK's transport, ADR-021/025). Only this notice is tolerated, and only in tests.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
branch = true
source = ["campaign_forge"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
